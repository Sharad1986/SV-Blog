<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SV WEALTH</title>

<style>
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0c1c2c;
    color: #d4af37;
    text-align: center;
}

header {
    padding: 30px;
}

header img {
    width: 160px;
}

h1 {
    letter-spacing: 10px;
    font-weight: 400;
}

.search-box {
    margin: 30px;
}

input {
    padding: 10px;
    width: 220px;
    border: 1px solid #d4af37;
    background: transparent;
    color: #d4af37;
}

button {
    padding: 10px 15px;
    background: #d4af37;
    border: none;
    color: #0c1c2c;
    font-weight: bold;
    cursor: pointer;
}

table {
    margin: auto;
    width: 95%;
    max-width: 800px;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(212,175,55,0.3);
}

th {
    background: rgba(212,175,55,0.15);
}

.remove {
    background: none;
    border: none;
    color: red;
    cursor: pointer;
}

.section-title {
    margin-top: 40px;
    font-size: 20px;
    letter-spacing: 4px;
}

.ticker {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: black;
    color: #d4af37;
    padding: 8px;
    overflow: hidden;
    white-space: nowrap;
}

.ticker span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 25s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<header>
    <!-- Upload your logo file in repo and make sure name matches -->
    <img src="logo.png" alt="SV WEALTH">
    <h1>SV WEALTH</h1>
</header>

<div class="search-box">
    <input id="symbolInput" placeholder="Add Stock (e.g. TCS)">
    <button onclick="addStock()">Add</button>
</div>

<table>
<thead>
<tr>
<th>Symbol</th>
<th>Price</th>
<th>Remove</th>
</tr>
</thead>
<tbody id="watchlist"></tbody>
</table>

<div class="section-title">GLOBAL MARKETS</div>
<table id="global"></table>

<div class="section-title">COMMODITIES</div>
<table id="commodities"></table>

<div class="section-title">CRYPTO</div>
<table id="crypto"></table>

<div class="ticker">
<span id="tickerText">SV WEALTH | Global Markets | Commodities | Crypto | NSE | Dow | Nasdaq | Gold | Bitcoin</span>
</div>

<script>
const proxy = "https://api.allorigins.win/raw?url=";
const base = "https://query1.finance.yahoo.com/v7/finance/quote?symbols=";

let stocks = JSON.parse(localStorage.getItem("stocks")) || [];

function save() {
    localStorage.setItem("stocks", JSON.stringify(stocks));
}

function formatSymbol(sym) {
    sym = sym.toUpperCase().trim();
    if(sym.endsWith(".NS") || sym.startsWith("^")) return sym;
    return sym + ".NS";
}

async function fetchData(symbols) {
    const res = await fetch(proxy + encodeURIComponent(base + symbols.join(",")));
    const data = await res.json();
    return data.quoteResponse.result;
}

async function updateWatchlist() {
    if(stocks.length === 0) return;
    const data = await fetchData(stocks);
    const tbody = document.getElementById("watchlist");
    tbody.innerHTML = "";
    data.forEach(item => {
        tbody.innerHTML += `
        <tr>
        <td>${item.symbol}</td>
        <td>${item.regularMarketPrice || 0}</td>
        <td><button class="remove" onclick="removeStock('${item.symbol}')">X</button></td>
        </tr>
        `;
    });
}

function addStock() {
    const input = document.getElementById("symbolInput");
    const symbol = formatSymbol(input.value);
    if(!stocks.includes(symbol)){
        stocks.push(symbol);
        save();
        updateWatchlist();
    }
    input.value="";
}

function removeStock(sym){
    stocks = stocks.filter(s => s !== sym);
    save();
    updateWatchlist();
}

async function loadSection(id, symbols){
    const data = await fetchData(symbols);
    const table = document.getElementById(id);
    table.innerHTML = `
    <tr><th>Name</th><th>Price</th><th>%</th></tr>
    `;
    data.forEach(item=>{
        table.innerHTML += `
        <tr>
        <td>${item.shortName || item.symbol}</td>
        <td>${item.regularMarketPrice || 0}</td>
        <td>${item.regularMarketChangePercent?.toFixed(2) || 0}%</td>
        </tr>
        `;
    });
}

updateWatchlist();
loadSection("global", ["^GSPC","^DJI","^IXIC","^FTSE","^N225"]);
loadSection("commodities", ["GC=F","CL=F","SI=F"]);
loadSection("crypto", ["BTC-USD","ETH-USD"]);

setInterval(updateWatchlist,60000);
</script>

</body>
</html>
