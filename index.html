<!DOCTYPE html>
<html>
<head>
<title>SV Wealth Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0c10;
    color:white;
}

header {
    text-align:center;
    padding:20px;
    background:#111;
}

header img {
    width:160px;
}

h2 {
    margin-top:40px;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.container {
    padding:20px;
}

.market-box {
    background:#1a1a1a;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

button {
    padding:5px 10px;
    background:#00b894;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

input {
    padding:5px;
    margin-right:5px;
}

.ticker {
    position:fixed;
    bottom:0;
    width:100%;
    background:black;
    color:#00ffcc;
    overflow:hidden;
    white-space:nowrap;
}

.ticker span {
    display:inline-block;
    padding-left:100%;
    animation:scroll 20s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<header>
    <img src="logo.png">
    <h1>SV Wealth Dashboard</h1>
</header>

<div class="container">

<!-- GLOBAL -->
<h2>🌍 Global Markets</h2>
<div id="global"></div>
<input id="globalInput" placeholder="Add Index (ex: ^GSPC)">
<button onclick="addMarket('global')">Add</button>

<!-- COMMODITIES -->
<h2>🛢 Commodities</h2>
<div id="commodities"></div>
<input id="commoditiesInput" placeholder="Add Commodity (ex: GC=F)">
<button onclick="addMarket('commodities')">Add</button>

<!-- INDIAN MARKET -->
<h2>🇮🇳 Indian Stock Market</h2>
<div id="india"></div>
<input id="indiaInput" placeholder="Add Stock (ex: RELIANCE.NS)">
<button onclick="addMarket('india')">Add</button>

</div>

<div class="ticker">
<span id="tickerText">
NIFTY 50 ▲  | SENSEX ▲  | GOLD ▲  | CRUDE ▼  | BTC ▲
</span>
</div>

<script>

let markets = {
    global: ["^GSPC", "^DJI"],
    commodities: ["GC=F", "CL=F"],
    india: ["^NSEI", "RELIANCE.NS"]
};

function renderMarkets() {
    for (let category in markets) {
        let div = document.getElementById(category);
        div.innerHTML = "";

        markets[category].forEach((symbol, index) => {
            div.innerHTML += `
            <div class="market-box">
                ${symbol}
                <button onclick="deleteMarket('${category}', ${index})">Delete</button>
            </div>
            `;
        });
    }
}

function addMarket(category) {
    let input = document.getElementById(category + "Input");
    let value = input.value.trim();
    if (value !== "") {
        markets[category].push(value);
        input.value = "";
        renderMarkets();
    }
}

function deleteMarket(category, index) {
    markets[category].splice(index, 1);
    renderMarkets();
}

renderMarkets();

</script>

</body>
</html>
