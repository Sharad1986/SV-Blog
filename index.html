<!DOCTYPE html>
<html>
<head>
<title>SV Wealth Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0c10;
    color:white;
}

/* HEADER */
header {
    background:black;
    padding:20px;
    text-align:center;
    border-bottom:2px solid gold;
}

header img {
    width:100px;
}

header h1 {
    color:gold;
    margin:10px 0 0;
    letter-spacing:2px;
}

/* SEARCH SECTION */
.search-section {
    padding:25px;
    text-align:center;
    background:#111;
}

.search-section input {
    padding:10px;
    width:300px;
    border:none;
    border-radius:5px;
}

.search-section button {
    padding:10px 15px;
    background:gold;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:5px;
}

#chart {
    height:500px;
    margin-top:20px;
}

/* MARKET SECTION */
.section {
    padding:30px 20px;
}

h2 {
    color:gold;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

/* TICKER */
.ticker {
    position:fixed;
    bottom:0;
    width:100%;
    border-top:2px solid gold;
    z-index:999;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<img src="logo.png" alt="SV Wealth Logo">
<h1>SV Wealth Terminal</h1>
</header>

<!-- SEARCH BAR -->
<div class="search-section">

<h2>🔍 Search Stock / Index / ETF / Crypto</h2>

<input type="text" id="symbolInput" placeholder="Example: NSE:RELIANCE or AMEX:PALL">
<button onclick="loadChart()">Load Chart</button>

<div id="chart"></div>

</div>

<!-- MARKET OVERVIEW -->
<div class="section">

<h2>🌎 Global | Commodities | India | Crypto | ETFs</h2>

<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript" 
src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
"colorTheme": "dark",
"dateRange": "1D",
"showChart": false,
"locale": "en",
"width": "100%",
"height": "550",
"tabs": [
{
"title": "Global",
"symbols": [
{"s": "FOREXCOM:SPXUSD"},
{"s": "FOREXCOM:NSXUSD"},
{"s": "FOREXCOM:DJI"}
]
},
{
"title": "Commodities",
"symbols": [
{"s": "TVC:GOLD"},
{"s": "TVC:SILVER"},
{"s": "TVC:USOIL"}
]
},
{
"title": "India",
"symbols": [
{"s": "NSE:NIFTY"},
{"s": "NSE:BANKNIFTY"},
{"s": "NSE:RELIANCE"}
]
},
{
"title": "Crypto",
"symbols": [
{"s": "BINANCE:BTCUSDT"},
{"s": "BINANCE:ETHUSDT"}
]
},
{
"title": "Global ETFs",
"symbols": [
{"s": "AMEX:PALL"},
{"s": "AMEX:URA"}
]
}
]
}
</script>

</div>
</div>

<!-- TICKER -->
<div class="ticker">
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript" 
src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
{
"symbols": [
{"proName":"NSE:NIFTY","title":"NIFTY"},
{"proName":"AMEX:PALL","title":"PALL"},
{"proName":"AMEX:URA","title":"URA"},
{"proName":"TVC:GOLD","title":"GOLD"},
{"proName":"BINANCE:BTCUSDT","title":"BTC"}
],
"colorTheme":"dark",
"isTransparent":false,
"displayMode":"adaptive",
"locale":"en"
}
</script>

</div>
</div>

<!-- ADVANCED CHART SCRIPT -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function loadChart() {

    var symbol = document.getElementById("symbolInput").value.trim();

    if(symbol === "") {
        alert("Please enter valid symbol");
        return;
    }

    document.getElementById("chart").innerHTML = "";

    new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": symbol,
        "interval": "D",
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "container_id": "chart"
    });
}
</script>

</body>
</html>
