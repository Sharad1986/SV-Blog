<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SV WEALTH</title>

<style>
body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #0c1c2c;
    color: #d4af37;
    text-align: center;
}

/* HEADER */
header {
    padding: 30px 20px;
}
header img {
    width: 160px;
}
h1 {
    letter-spacing: 10px;
    font-weight: 400;
    margin-top: 10px;
}

/* SEARCH */
.search-container {
    margin: 30px auto;
}
input {
    padding: 10px;
    width: 220px;
    border: 1px solid #d4af37;
    background: transparent;
    color: #d4af37;
}
button {
    padding: 10px 18px;
    background: #d4af37;
    border: none;
    cursor: pointer;
    color: #0c1c2c;
    font-weight: bold;
}

/* TABLE */
table {
    margin: auto;
    width: 95%;
    max-width: 900px;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    padding: 12px;
    border-bottom: 1px solid rgba(212,175,55,0.3);
}
th {
    background: rgba(212,175,55,0.15);
}
.remove-btn {
    background: none;
    border: none;
    color: #ff6666;
    cursor: pointer;
}

/* SECTION TITLE */
.section-title {
    margin-top: 50px;
    font-size: 22px;
    letter-spacing: 4px;
}

/* TICKER */
.ticker {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #111;
    color: #d4af37;
    padding: 8px 0;
    white-space: nowrap;
    overflow: hidden;
}
.ticker-content {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 25s linear infinite;
}
@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<header>
    <img src="logo.png" alt="SV WEALTH Logo">
    <h1>SV WEALTH</h1>
</header>

<!-- USER WATCHLIST -->
<div class="search-container">
    <input type="text" id="stockInput" placeholder="Add Stock/Index (e.g. TCS)">
    <button onclick="addSymbol()">Add</button>
</div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Live Price</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<!-- GLOBAL MARKETS -->
<div class="section-title">GLOBAL MARKETS</div>
<table id="globalMarkets"></table>

<!-- COMMODITIES -->
<div class="section-title">COMMODITIES</div>
<table id="commodities"></table>

<!-- CRYPTO -->
<div class="section-title">CRYPTO</div>
<table id="crypto"></table>

<!-- NEWS TICKER -->
<div class="ticker">
    <div class="ticker-content" id="tickerText">
        Loading market data...
    </div>
</div>

<script>
const proxy = "https://api.allorigins.win/raw?url=";
const yahooBase = "https://query1.finance.yahoo.com/v7/finance/quote?symbols=";

let watchlist = JSON.parse(localStorage.getItem("watchlist")) || [];
const watchlistBody = document.getElementById("watchlist");

function formatSymbol(sym) {
    sym = sym.trim().toUpperCase();
    if (sym === "NIFTY50") return "^NSEI";
    if (sym === "SENSEX") return "^BSESN";
    if (sym === "BANKNIFTY") return "^NSEBANK";
    if (sym.endsWith(".NS") || sym.startsWith("^")) return sym;
    return sym + ".NS";
}

async function fetchQuotes(symbols) {
    const url = proxy + encodeURIComponent(yahooBase + symbols.join(","));
    const res = await fetch(url);
    const data = await res.json();
    return data.quoteResponse.result;
}

/* WATCHLIST */
async function updateWatchlist() {
    watchlistBody.innerHTML = "";
    if (watchlist.length === 0) return;

    const quotes = await fetchQuotes(watchlist);
    quotes.forEach(q => {
        watchlistBody.innerHTML += `
            <tr>
                <td>${q.symbol}</td>
                <td>${q.regularMarketPrice || 0}</td>
                <td><button class="remove-btn" onclick="removeSymbol('${q.symbol}')">×</button></td>
            </tr>
        `;
    });
}

function addSymbol() {
    const input = document.getElementById("stockInput");
    const formatted = formatSymbol(input.value);
    if (!watchlist.includes(formatted)) {
        watchlist.push(formatted);
        localStorage.setItem("watchlist", JSON.stringify(watchlist));
        updateWatchlist();
    }
    input.value = "";
}

function removeSymbol(symbol) {
    watchlist = watchlist.filter(s => s !== symbol);
    localStorage.setItem("watchlist", JSON.stringify(watchlist));
    updateWatchlist();
}

/* GLOBAL DATA */
async function loadSection(tableId, symbols) {
    const table = document.getElementById(tableId);
    const quotes = await fetchQuotes(symbols);

    table.innerHTML = `
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Change %</th>
        </tr>
    `;

    quotes.forEach(q => {
        table.innerHTML += `
            <tr>
                <td>${q.shortName || q.symbol}</td>
                <td>${q.regularMarketPrice || 0}</td>
                <td>${q.regularMarketChangePercent?.toFixed(2) || 0}%</td>
            </tr>
        `;
    });
}

/* INIT LOAD */
updateWatchlist();

loadSection("globalMarkets", ["^GSPC","^DJI","^IXIC","^FTSE","^N225","^HSI"]);
loadSection("commodities", ["GC=F","SI=F","CL=F"]);
loadSection("crypto", ["BTC-USD","ETH-USD"]);

setInterval(updateWatchlist, 60000);
setInterval(() => {
    loadSection("globalMarkets", ["^GSPC","^DJI","^IXIC","^FTSE","^N225","^HSI"]);
    loadSection("commodities", ["GC=F","SI=F","CL=F"]);
    loadSection("crypto", ["BTC-USD","ETH-USD"]);
}, 60000);

/* TICKER */
document.getElementById("tickerText").innerText =
"Dow | Nasdaq | S&P 500 | Gold | Crude Oil | Bitcoin | Ethereum | Nifty 50 | Sensex | Bank Nifty";
</script>

</body>
</html>
