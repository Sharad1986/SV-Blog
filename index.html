<!DOCTYPE html>
<html>
<head>
<title>SV Wealth Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0c10;
    color:white;
}

.main-header {
    background:black;
    padding:30px;
    text-align:center;
    border-bottom:2px solid gold;
}

.logo-container img {
    width:120px;
}

.logo-container h1 {
    color:gold;
    margin:10px 0 0;
    letter-spacing:2px;
}

.section {
    padding:30px 20px;
}

h2 {
    color:gold;
    margin-bottom:20px;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="main-header">
    <div class="logo-container">
        <img src="logo.png" alt="SV Wealth Logo">
        <h1>SV Wealth</h1>
    </div>
</header>

<!-- GLOBAL MARKETS -->
<div class="section">
<h2>🌍 Global Markets</h2>

<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div id="global_widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": true,
  "locale": "en",
  "width": "100%",
  "height": "500",
  "tabs": [
    {
      "title": "Global",
      "symbols": [
        {"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
        {"s": "FOREXCOM:NSXUSD", "d": "NASDAQ"},
        {"s": "FOREXCOM:DJI", "d": "Dow Jones"},
        {"s": "FOREXCOM:UKXGBP", "d": "FTSE 100"}
      ]
    }
  ]
}
  </script>
</div>
</div>

<!-- COMMODITIES -->
<div class="section">
<h2>🛢 Commodities</h2>

<div class="tradingview-widget-container">
  <div id="commodity_widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": true,
  "locale": "en",
  "width": "100%",
  "height": "500",
  "tabs": [
    {
      "title": "Commodities",
      "symbols": [
        {"s": "COMEX:GC1!", "d": "Gold"},
        {"s": "NYMEX:CL1!", "d": "Crude Oil"},
        {"s": "CBOT:SI1!", "d": "Silver"}
      ]
    }
  ]
}
  </script>
</div>
</div>

<!-- INDIAN MARKET -->
<div class="section">
<h2>🇮🇳 Indian Market</h2>

<div class="tradingview-widget-container">
  <div id="india_widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
  "colorTheme": "dark",
  "dateRange": "1D",
  "showChart": true,
  "locale": "en",
  "width": "100%",
  "height": "500",
  "tabs": [
    {
      "title": "India",
      "symbols": [
        {"s": "NSE:NIFTY", "d": "Nifty 50"},
        {"s": "BSE:SENSEX", "d": "Sensex"},
        {"s": "NSE:RELIANCE", "d": "Reliance"},
        {"s": "NSE:TCS", "d": "TCS"}
      ]
    }
  ]
}
  </script>
</div>
</div>

</body>
</html>
