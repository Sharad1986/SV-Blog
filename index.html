<!DOCTYPE html>
<html>
<head>
<title>SV Wealth Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0c10;
    color:white;
}

.main-header {
    background:black;
    padding:25px;
    text-align:center;
    border-bottom:2px solid gold;
}

.logo-container img {
    width:120px;
}

.logo-container h1 {
    color:gold;
    margin:10px 0 0;
}

.container {
    padding:20px;
}

h2 {
    color:gold;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.market-box {
    background:#1a1a1a;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

.green { color:#00ff99; }
.red { color:#ff4d4d; }

</style>
</head>

<body>

<header class="main-header">
    <div class="logo-container">
        <img src="logo.png">
        <h1>SV Wealth</h1>
    </div>
</header>

<div class="container">

<h2>🌍 Global Markets</h2>
<div id="global">Loading...</div>

<h2>🛢 Commodities</h2>
<div id="commodities">Loading...</div>

<h2>🇮🇳 Indian Stock Market</h2>
<div id="india">Loading...</div>

</div>

<script>

let markets = {
    global: ["^GSPC","^DJI","^IXIC"],
    commodities: ["GC=F","CL=F"],
    india: ["^NSEI","RELIANCE.NS"]
};

async function fetchPrice(symbol) {
    try {
        let proxy = "https://api.allorigins.win/get?url=";
        let url = encodeURIComponent(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`);
        
        let response = await fetch(proxy + url);
        let data = await response.json();
        let parsed = JSON.parse(data.contents);

        let quote = parsed.quoteResponse.result[0];

        return {
            price: quote.regularMarketPrice,
            change: quote.regularMarketChangePercent
        };
    } catch (error) {
        console.log("Error:", error);
        return null;
    }
}

async function renderMarkets() {

    for (let category in markets) {
        let div = document.getElementById(category);
        let html = "";

        for (let symbol of markets[category]) {
            let data = await fetchPrice(symbol);

            if (data) {
                let color = data.change >= 0 ? "green" : "red";
                html += `
                <div class="market-box">
                    <span>${symbol}</span>
                    <span class="${color}">
                        ${data.price} (${data.change.toFixed(2)}%)
                    </span>
                </div>`;
            }
        }

        div.innerHTML = html || "Data unavailable";
    }
}

renderMarkets();
setInterval(renderMarkets, 30000);

</script>

</body>
</html>
